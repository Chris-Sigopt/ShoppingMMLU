services:
  ShoppingMMLU:
    image: vault.habana.ai/gaudi-docker/1.21.1/ubuntu24.04/habanalabs/pytorch-installer-2.6.0:latest
    runtime: habana
    environment:
      - HABANA_VISIBLE_DEVICES=all
      - OMPI_MCA_btl_vader_single_copy_mechanism=none
      - HF_TOKEN=<YOUR TOKEN>
      - HF_HOME=/data/huggingface
      - PT_HPU_LAZY_MODE=1
    cap_add:
      - sys_nice
    volumes:
      - .:/shopping
    command:
      - bash
      - -c
      - |
        cd /shopping
        pip install -r requirements.txt
        mkdir data
        unzip data.zip -d data/
        cd task_wise_eval
        python3 hf_multi_choice.py --test_subject asin_compatibility --model_name llama3-8b --quant_config quant_config/maxabs_measure.json
        python3 hf_multi_choice.py --test_subject asin_compatibility --model_name llama3-8b --quant_config quant_config/maxabs_quant.json
