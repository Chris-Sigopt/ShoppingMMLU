services:
  ShoppingMMLU-bf0:
    image: vault.habana.ai/gaudi-docker/1.21.1/ubuntu24.04/habanalabs/pytorch-installer-2.6.0:latest
    runtime: habana
    environment:
      - HABANA_VISIBLE_DEVICES=0
      - OMPI_MCA_btl_vader_single_copy_mechanism=none
      - HF_TOKEN=<YOUR TOKEN>
      - HF_HOME=/data/huggingface
      - PT_HPU_LAZY_MODE=1
    cap_add:
      - sys_nice
    volumes:
      - ~/ShoppingMMLU:/shopping
    command:
      - bash
      - -c
      - |
        cd /shopping
        pip install -r requirements.txt
        pip install git+https://github.com/HabanaAI/DeepSpeed.git@1.21.0
        mkdir data
        unzip data.zip -d data/
        cd skill_wise_eval
        deepspeed --num_nodes 1 --num_gpus 8 --no_local_rank --master_port 29500 hf_skill_inference.py --model_name llama2-70b --filename skill1_concept --output_filename output_docker_test --deepspeed
        python3 skill_evaluation.py --data_filename skill1_concept --output_filename llama2-70b_output_docker_test